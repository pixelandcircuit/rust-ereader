[package]
name = "ereader"
version = "0.1.0"
edition = "2021"

[features]
default = ["esp"]
esp = [
    "dep:esp-hal",
    "dep:esp-alloc",
    "dep:esp-backtrace",
    "dep:esp-println",
    "dep:esp-bootloader-esp-idf",
    "dep:esp-storage",
    "dep:embedded-storage",
    "dep:embedded-storage-async",
    "dep:sequential-storage",
    "dep:embedded-hal",
    "dep:embedded-graphics",
    "dep:embedded-graphics-core",
    "dep:log",
    "dep:iris-ui",
    "dep:esp-radio",
    "dep:esp-rtos",
    "dep:embassy-executor",
    "dep:embassy-net",
    "dep:critical-section",
    "dep:embassy-sync",
    "dep:embassy-time",
    "dep:static_cell",
    "dep:embedded-sdmmc",
    "dep:embedded-hal-bus",
]
simulator = [
    "dep:embedded-graphics",
    "dep:embedded-graphics-core",
    "dep:embedded-graphics-simulator",
    "dep:iris-ui",
    "dep:env_logger",
    "dep:log",
]
# Opt-in WebSocket debug/inspection server (embedded-inspect). Off by default —
# adds no size/behavior cost unless explicitly enabled alongside "esp" or
# "simulator". See changes.md for usage.
debug-inspect = [
    "dep:embedded-inspect",
    "dep:embedded-websocket",
    "dep:httparse",
    "dep:qrcode-core",
    "embassy-net?/tcp",
    "embassy-net?/multicast",
]

[dependencies]
# Always required
fontdue    = "0.9"
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
xmlparser   = { version = "0.13", default-features = false }

# ESP-only (optional, enabled via the "esp" feature)
esp-hal                = { version = "1.1.0", features = ["esp32s3", "unstable"], optional = true }
esp-alloc              = { version = "0.10.0", optional = true }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"], optional = true }
esp-backtrace          = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"], optional = true }
esp-println            = { version = "0.17.0", features = ["esp32s3", "log-04"], optional = true }
log                    = { version = "0.4", optional = true }
esp-storage            = { version = "0.4", features = ["esp32s3", "nor-flash"], optional = true }
embedded-storage       = { version = "0.3", optional = true }
embedded-storage-async = { version = "0.4", optional = true }
sequential-storage     = { version = "3.0", optional = true }
embedded-hal           = { version = "1", optional = true }
embedded-graphics           = { version = "0.8", optional = true }
embedded-graphics-core      = { version = "0.4", optional = true }
embedded-graphics-simulator = { version = "0.8", optional = true }
iris-ui                     = { path = "../rust-embedded-gui", optional = true, features = ['ttf'] }
env_logger                  = { version = "0.11", optional = true }
esp-radio        = { version = "0.18.0", features = ["wifi", "esp32s3"], optional = true }
esp-rtos         = { version = "0.3.0",  features = ["esp32s3", "esp-radio", "embassy"], optional = true }
embassy-executor = { version = "0.10.0", optional = true }
embassy-net      = { version = "0.8.0",  features = ["dhcpv4", "medium-ethernet", "udp"], optional = true }
critical-section = { version = "1",      optional = true }
embassy-sync     = { version = "0.8",    optional = true }
embassy-time     = { version = "0.5.0",  optional = true }
static_cell      = { version = "2.1.0",  optional = true }
embedded-sdmmc   = { version = "0.9",  default-features = false, optional = true }
embedded-hal-bus = { version = "0.2",  optional = true }

# debug-inspect only (optional, enabled via the "debug-inspect" feature)
embedded-inspect   = { path = "../embedded-inspect/embedded-inspect", optional = true }
embedded-websocket = { version = "0.9", default-features = false, optional = true }
httparse           = { version = "1",   default-features = false, optional = true }
qrcode-core        = { version = "2",   optional = true }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units    = 1
debug            = 2
debug-assertions = false
incremental      = false
lto              = "fat"
opt-level        = "s"
overflow-checks  = false

[package.metadata.espflash]
partition_table = "partitions.csv"
